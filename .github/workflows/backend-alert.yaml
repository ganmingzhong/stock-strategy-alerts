name: Backend Alert Scheduler

on:
  workflow_dispatch: {}
  schedule:
    # GitHub Actions cron uses UTC. 08:35 UTC = 4:35 PM Asia/Kuala_Lumpur/Singapore.
    - cron: '35 8 * * *'

jobs:
  run-alert:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test backend alert script
        run: |
          python -m py_compile scheduler_alerts/run_strategy_alerts.py

      - name: Run backend alert
        run: |
          python scheduler_alerts/run_strategy_alerts.py
